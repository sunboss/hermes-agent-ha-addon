name: "Open WebUI"
description: "User-friendly, customizable WebUI for Large Language Models with Ingress and Ollama/OpenAI API support."
version: "2026.9.18.0"
slug: "open_webui"
init: false
startup: "application"
stage: "stable"
ingress: true
ingress_port: 8080
panel_title: "Open WebUI"
panel_icon: "mdi:chat-processing-outline"
arch:
  - aarch64
  - amd64
url: "https://github.com/sunboss/hermes-agent-ha-addon"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Direct WebUI access port (optional when Ingress is used)"
map:
  - addon_config:rw
options:
  openai_api_base_url: "http://hermes_agent:8642/v1"
  openai_api_key: ""
  ollama_base_url: ""
  webui_auth: false
  webui_name: "Open WebUI"
  enable_signup: true
  default_models: ""
schema:
  openai_api_base_url: "str?"
  openai_api_key: "password?"
  ollama_base_url: "str?"
  webui_auth: "bool"
  webui_name: "str"
  enable_signup: "bool"
  default_models: "str?"
