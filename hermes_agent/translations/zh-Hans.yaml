configuration:
  openai_api_key:
    name: "API 密钥 (OpenAI Key)"
    description: "必填。输入你的 API Key 即可启动服务并直接对话。"
  llm_model:
    name: "智能模型 (留空自动拉取)"
    description: "留空时系统将自动从 https://api.1234r.com/v1 拉取可用模型；也可以输入自定义模型名称（如 gpt-4o、gemini-3.8-flash-high 等）。"
  openai_base_url:
    name: "API 服务地址 (Base URL)"
    description: "默认已锁定为 https://api.1234r.com/v1，通常无需改动。"
  openrouter_api_key:
    name: "OpenRouter API Key"
    description: "可选。如需通过 OpenRouter 路由，在此填入 Key。"
  auth_mode:
    name: "认证模式"
    description: "默认 api_key。如需网页登录可切换为 web_login。"
  auth_storage_path:
    name: "认证存储路径"
    description: "登录会话与凭据存储路径，保持默认即可。"
  terminal_backend:
    name: "终端执行后端"
    description: "默认为 local（使用内置 ttyd 终端执行命令）。"
  watch_domains:
    name: "监听实体域"
    description: "需要监控状态变化的域（如 light、switch、sensor）。"
  watch_entities:
    name: "监听指定实体"
    description: "需要单独监听的具体实体（如 light.living_room）。"
  ignore_entities:
    name: "忽略实体"
    description: "始终忽略的实体，即使其所属域在监听范围内。"
  watch_all:
    name: "监听所有实体 (Watch All Entities)"
    description: "开启后将所有状态变化通知 Hermes（事件频繁，建议保持关闭）。"
  cooldown_seconds:
    name: "事件冷却时间 (秒)"
    description: "同一实体两次触发通知的最短间隔，防止事件风暴（默认 30 秒）。"
  messaging_cwd:
    name: "工作目录 (Working Directory)"
    description: "Agent 执行操作的默认根路径（默认 /config/workspace）。"
  api_server_key:
    name: "API 服务密钥 (API Server Key)"
    description: "内置 8642 端口的访问保护密钥，留空则自动生成。"
