daemon off;
pid /tmp/nginx.pid;
worker_processes 1;
pcre_jit on;
error_log /tmp/nginx_error.log error;

events {
    worker_connections 512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /tmp/nginx_access.log;
    sendfile      on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream hermes_dashboard {
        server 127.0.0.1:9120;
    }

    upstream hermes_native {
        server 127.0.0.1:9120;
    }

    # ── Ingress 端口 8099 ── 供 Home Assistant Supervisor 使用 ──────────
    server {
        listen 8099 default_server;

        root /dev/null;
        server_name _;

        client_max_body_size 512m;

        # 允许 HA Supervisor 及 Docker 内部网段访问
        allow 172.30.0.0/16;
        allow 127.0.0.1;
        deny  all;

        location / {
            proxy_pass         http://hermes_dashboard;
            proxy_http_version 1.1;

            # WebSocket 支持
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # 关键：将 Host 和 Origin 重写为上游监听地址，使 hermes dashboard 放行
            proxy_set_header   Host       127.0.0.1:9120;
            proxy_set_header   Origin     http://127.0.0.1:9120;

            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Prefix $http_x_ingress_path;
            proxy_set_header   X-Hermes-Session-Token "hermes-ha-addon-persistent-session-token-v1";
            proxy_set_header   Accept-Encoding    "";

            # 流式传输 / SSE 必需：关闭缓冲
            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      86400s;
            proxy_send_timeout      86400s;
            proxy_redirect          off;
        }
    }

    # ── 直连端口 9119 ── 局域网直接访问，无需 Ingress ──────────────────
    server {
        listen 9119 default_server;

        root /dev/null;
        server_name _;

        client_max_body_size 512m;

        location / {
            proxy_pass         http://hermes_native;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       127.0.0.1:9120;
            proxy_set_header   Origin     http://127.0.0.1:9120;

            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   Accept-Encoding    "";

            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      86400s;
            proxy_send_timeout      86400s;
            proxy_redirect          off;
        }
    }
}
