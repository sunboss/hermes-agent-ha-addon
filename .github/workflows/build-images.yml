name: Build and Publish Hermes Agent Images

on:
  push:
    branches:
      - main
    paths:
      - 'hermes_agent/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            docker_arch: linux/arm64
            base_image: nousresearch/hermes-agent:v2026.9.21
          - arch: amd64
            docker_arch: linux/amd64
            base_image: nousresearch/hermes-agent:v2026.9.21

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' hermes_agent/config.yaml | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current Version: $VERSION"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: hermes_agent
          file: hermes_agent/Dockerfile
          platforms: ${{ matrix.docker_arch }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-agent-${{ matrix.arch }}:latest
            ghcr.io/${{ github.repository_owner }}/hermes-agent-${{ matrix.arch }}:${{ env.VERSION }}
