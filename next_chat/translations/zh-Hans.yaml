configuration:
  api_key:
    name: "API 密钥 (OpenAI Key)"
    description: "必填。输入你的 API Key 即可使用 NextChat。"
  custom_models:
    name: "可用模型 (留空自动拉取)"
    description: "留空自动拉取服务端模型列表；也可自定义模型名，支持逗号分隔。"
  base_url:
    name: "API 基础服务地址"
    description: "默认预设为 https://api.1234r.com/v1，无需改动。"
  access_code:
    name: "界面访问密码"
    description: "可选。为 NextChat Web 界面设置访问密码，留空则免密进入。"
