configuration:
  openai_api_key:
    name: "API 密钥 (OpenAI Key)"
    description: "必填。输入你的 API Key 即可使用 LobeChat。"
  default_model:
    name: "智能模型 (留空自动拉取)"
    description: "留空时自动从 https://api.1234r.com/v1 拉取模型列表；亦可自定义预设模型。"
  openai_proxy_url:
    name: "API 服务地址 (Proxy URL)"
    description: "默认预设为 https://api.1234r.com/v1，无需改动。"
  access_code:
    name: "界面访问密码"
    description: "可选。为 LobeChat Web 界面设置访问密码，留空则免密进入。"
