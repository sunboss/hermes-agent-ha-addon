name: "LobeChat"
description: "Modern, open-source AI chat framework with plugin system, TTS, and multi-modal support for Home Assistant."
version: "2026.9.18.1"
slug: "lobe_chat"
init: false
startup: "application"
stage: "stable"
ingress: true
ingress_port: 3210
panel_title: "LobeChat"
panel_icon: "mdi:robot-happy-outline"
arch:
  - aarch64
  - amd64
url: "https://github.com/sunboss/hermes-agent-ha-addon"
ports:
  3210/tcp: 3210
ports_description:
  3210/tcp: "Direct LobeChat Web port (optional when Ingress is used)"
map:
  - addon_config:rw
options:
  openai_proxy_url: "http://hermes_agent:8642/v1"
  openai_api_key: ""
  access_code: ""
  default_model: "gemini-3.8-flash-high"
schema:
  openai_proxy_url: "str?"
  openai_api_key: "password?"
  access_code: "password?"
  default_model: "str?"
